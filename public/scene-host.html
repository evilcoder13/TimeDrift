<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https: http:; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; font-src 'none'; media-src 'none';"
  />
  <title>TimeDrift Scene Host</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <svg
    id="scene-svg"
    viewBox="0 0 1920 1080"
    preserveAspectRatio="xMidYMid slice"
    xmlns="http://www.w3.org/2000/svg"
  ></svg>

  <script>
    (function () {
      'use strict';

      const svgEl = document.getElementById('scene-svg');
      let currentHandle = null;
      let activeSceneId = null;

      function postToParent(msg) {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(msg, '*');
          }
        } catch (err) {
          // Ignore messaging errors
        }
      }

      window.addEventListener('error', function (evt) {
        postToParent({
          type: 'SCENE_ERROR',
          message: evt.message || 'Scene execution error',
          stack: evt.error ? evt.error.stack : undefined
        });
      });

      window.addEventListener('unhandledrejection', function (evt) {
        postToParent({
          type: 'SCENE_ERROR',
          message: evt.reason ? (evt.reason.message || String(evt.reason)) : 'Unhandled rejection',
          stack: evt.reason && evt.reason.stack ? evt.reason.stack : undefined
        });
      });

      async function loadScene(bundleUrl, opts, sceneId) {
        destroyCurrent();
        activeSceneId = sceneId;

        try {
          // Dynamic import of the bundled scene module
          const mod = await import(bundleUrl);
          const candidate = mod.default || mod;
          let mountFn = null;

          if (typeof candidate === 'function') {
            mountFn = candidate;
          } else if (candidate && typeof candidate.mount === 'function') {
            mountFn = candidate.mount.bind(candidate);
          } else if (typeof mod.mount === 'function') {
            mountFn = mod.mount.bind(mod);
          }

          if (typeof mountFn !== 'function') {
            throw new Error('Scene bundle does not export a mount function (found: ' + typeof candidate + ')');
          }

          // Clean svg element children before mount
          while (svgEl.firstChild) {
            svgEl.removeChild(svgEl.firstChild);
          }

          currentHandle = mountFn(svgEl, opts || {
            seed: 42,
            dayLengthSec: 900,
            startTau: 0.5,
            reducedMotion: false
          });

          postToParent({
            type: 'SCENE_MOUNTED',
            sceneId: activeSceneId
          });
        } catch (err) {
          postToParent({
            type: 'SCENE_ERROR',
            message: err && err.message ? err.message : String(err),
            stack: err && err.stack ? err.stack : undefined
          });
        }
      }

      function destroyCurrent() {
        if (currentHandle) {
          try {
            if (typeof currentHandle.destroy === 'function') {
              currentHandle.destroy();
            }
          } catch (e) {
            // Ignore destruction error
          }
          currentHandle = null;
        }
        while (svgEl.firstChild) {
          svgEl.removeChild(svgEl.firstChild);
        }
      }

      window.addEventListener('message', function (event) {
        const data = event.data;
        if (!data || typeof data.type !== 'string') return;

        switch (data.type) {
          case 'LOAD_SCENE':
            if (data.bundleUrl) {
              loadScene(data.bundleUrl, data.opts, data.sceneId);
            }
            break;

          case 'SET_PLAY_STATE':
            if (currentHandle) {
              if (data.paused) {
                if (typeof currentHandle.pause === 'function') currentHandle.pause();
              } else {
                if (typeof currentHandle.resume === 'function') currentHandle.resume();
              }
            }
            break;

          case 'SET_SPEED':
            if (currentHandle && typeof currentHandle.setSpeed === 'function') {
              const speed = typeof data.speed === 'number' ? Math.max(0.25, Math.min(1.0, data.speed)) : 1.0;
              currentHandle.setSpeed(speed);
            }
            break;

          case 'UPDATE_TAU':
            if (currentHandle && typeof currentHandle.updateTau === 'function') {
              currentHandle.updateTau(data.tau);
            }
            break;

          case 'DESTROY':
            destroyCurrent();
            break;

          default:
            break;
        }
      });

      // Signal to parent that host runtime is loaded and ready
      postToParent({
        type: 'HOST_READY',
        timestamp: Date.now()
      });
    })();
  </script>
</body>
</html>
