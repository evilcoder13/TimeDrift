services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: timedrift-web:latest
    container_name: timedrift_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/timedrift.db
      - STORAGE_DIR=/app/storage
      - STORAGE_AUDIO_DIR=/app/storage/audio
      - STORAGE_BUNDLES_DIR=/app/storage/bundles
      - AUTH_SECRET=${AUTH_SECRET:-timedrift-prod-secret-viecnho-2026}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=https://timedrift.duckdns.org
      - NEXTAUTH_URL=https://timedrift.duckdns.org
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@timedrift.local,evilcoder13@gmail.com}
      # Connected via Tailscale Mesh to tech42vn (100.100.91.61)
      - LLM_BASE_URL=${LLM_BASE_URL:-http://100.100.91.61:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-not-needed}
      - LLM_MODEL=${LLM_MODEL:-default}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-default}
      # Connected via Tailscale Mesh to tech42vn (or tech42 when online)
      - MUSIC_WORKER_URL=${MUSIC_WORKER_URL:-http://100.100.91.61:8100}
      - NEXT_PUBLIC_FREE_MAX_MINUTES=15
      - NEXT_PUBLIC_PRO_MAX_MINUTES=720
    volumes:
      - timedrift_data:/app/data
      - timedrift_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  timedrift_data:
    name: timedrift_data
  timedrift_storage:
    name: timedrift_storage
